<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RTSP 原生 HTML 演示</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23171d1a'/%3E%3Cpath d='M15 20h24a10 10 0 0 1 0 20H15z' fill='%2372aa7d'/%3E%3Ccircle cx='39' cy='30' r='5' fill='%23111513'/%3E%3Cpath d='M43 26l8-5v18l-8-5z' fill='%23cbd6cc'/%3E%3C/svg%3E" />
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111513;
      color: #f5f7f4;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #111513; }
    main { width: min(1100px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 40px; }
    header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
    h1 { margin: 0 0 8px; font-size: clamp(26px, 4vw, 42px); line-height: 1.08; }
    p { margin: 0; color: #b8c0b8; line-height: 1.65; }
    .status { display: inline-flex; align-items: center; min-height: 34px; padding: 0 10px; border: 1px solid #314139; border-radius: 6px; color: #cbd6cc; background: #17201b; white-space: nowrap; }
    .status.ok { border-color: #4b8d58; color: #baf3c4; background: #17341d; }
    .status.error { border-color: #8d544b; color: #ffd2c8; background: #351a16; }
    .panel { display: grid; gap: 14px; padding: 16px; border: 1px solid #2f3d36; border-radius: 8px; background: #171d1a; }
    .controls { display: grid; grid-template-columns: 1fr auto auto auto; gap: 10px; align-items: end; margin: 18px 0; }
    label { display: grid; gap: 8px; color: #cdd6ce; font-size: 13px; }
    input {
      width: 100%;
      min-height: 44px;
      padding: 0 12px;
      border: 1px solid #405149;
      border-radius: 6px;
      background: #0c100e;
      color: #fff;
      font: 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      outline: none;
    }
    input:focus { border-color: #72aa7d; box-shadow: 0 0 0 3px rgba(114, 170, 125, .18); }
    button, a.download {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid #405149;
      border-radius: 6px;
      background: #1f2924;
      color: #f6faf5;
      text-decoration: none;
      font: 600 14px system-ui, sans-serif;
      cursor: pointer;
    }
    button.primary { border-color: #5b9e67; background: #224d2b; }
    .stage { aspect-ratio: 16 / 9; min-height: 260px; background: #030504; border: 1px dashed #48564e; border-radius: 8px; overflow: hidden; position: relative; }
    .stage iframe { width: 100%; height: 100%; border: 0; display: block; background: #000; }
    .placeholder { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; color: #93a096; text-align: center; }
    .downloads { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .log { min-height: 44px; padding: 12px; border-radius: 6px; background: #0d110f; color: #aeb8af; font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; }
    @media (max-width: 820px) {
      header { display: grid; }
      .controls { grid-template-columns: 1fr; }
      .status { width: 100%; white-space: normal; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>RTSP 原生 HTML 演示</h1>
        <p>原生 HTML/CSS/JS 集成示例。页面加载后会请求扩展把当前页面来源加入白名单，然后检测本地运行时和播放权限。</p>
      </div>
      <span id="installStatus" class="status">检测中</span>
    </header>

    <section class="panel" aria-label="RTSP 播放演示">
      <div class="controls">
        <label>
          RTSP 地址
          <input id="rtspUrl" autocomplete="off" value="rtsp://9627b0bf2a7b.entrypoint.cloud.wowza.com:1935/app-p5260J38/66abe4b9_stream1" />
        </label>
        <button id="checkBtn" type="button">重新检测</button>
        <button id="playBtn" class="primary" type="button">播放</button>
        <button id="stopBtn" type="button">停止</button>
      </div>

      <div id="playerStage" class="stage">
        <div class="placeholder">等待安装检测完成</div>
      </div>

      <div>
        <p>本地安装包下载</p>
        <div id="downloads" class="downloads"></div>
      </div>

      <div id="log" class="log" role="status">初始化中...</div>
    </section>
  </main>

  <script type="module">
    import { createRTSPInstallDetector } from "./rtsp-install-detector.js";

    const detector = createRTSPInstallDetector({ timeout: 2200 });
    const statusEl = document.querySelector("#installStatus");
    const stage = document.querySelector("#playerStage");
    const logEl = document.querySelector("#log");
    const urlInput = document.querySelector("#rtspUrl");
    const downloads = document.querySelector("#downloads");
    let playerFrame = null;
    let playerReady = Promise.resolve();
    let extensionOrigin = "";

    function log(message) {
      logEl.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
    }

    function renderDownloads() {
      downloads.innerHTML = "";
      const installers = detector.getInstallers();
      for (const items of Object.values(installers)) {
        for (const item of items) {
          const link = document.createElement("a");
          link.className = "download";
          link.href = item.url;
          link.download = item.file;
          link.dataset.filename = item.file;
          link.textContent = `下载 ${item.label}`;
          link.addEventListener("click", (event) => {
            event.preventDefault();
            downloadInstaller(item.url, item.file);
          });
          downloads.appendChild(link);
        }
      }
    }

    async function downloadInstaller(url, filename) {
      log(`正在准备下载：${filename}`);
      try {
        if ("showSaveFilePicker" in window) {
          const handle = await window.showSaveFilePicker({ suggestedName: filename });
          const writable = await handle.createWritable();
          const response = await fetch(url);
          if (!response.ok || !response.body) throw new Error(`HTTP ${response.status}`);
          await response.body.pipeTo(writable);
          log(`下载完成：${filename}`);
          return;
        }
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);
        const anchor = document.createElement("a");
        anchor.href = blobUrl;
        anchor.download = filename;
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        setTimeout(() => URL.revokeObjectURL(blobUrl), 30000);
        log(`已开始下载：${filename}`);
      } catch (err) {
        log(`下载失败：${err?.message || err}`);
        window.location.href = url;
      }
    }

    function renderStatus(status) {
      extensionOrigin = status.extensionOrigin || extensionOrigin;
      const ok = status.installed && status.nativeOk && status.originAllowed;
      statusEl.className = `status ${ok ? "ok" : "error"}`;
      if (ok) {
        statusEl.textContent = `已就绪：${status.extensionId} / ${status.nativePort || "-"}`;
        log(status.originAdded ? `已自动授权页面来源：${status.origin}` : `当前页面来源已授权：${status.origin}`);
        return;
      }
      if (!status.installed) {
        statusEl.textContent = "未检测到 Chrome 扩展";
        log("未检测到 Chrome 扩展，请先下载并安装本页下方对应系统的安装包。");
      } else if (!status.nativeOk) {
        statusEl.textContent = `本地运行时未就绪：${status.nativeError || "未知错误"}`;
        log(`本地运行时未就绪：${status.nativeError || "未知错误"}`);
      } else if (!status.originAllowed) {
        statusEl.textContent = `当前页面来源未授权：${status.originError || status.origin}`;
        log(`当前页面来源未授权：${status.originError || status.origin}`);
      }
    }

    function ensureFrame() {
      if (!extensionOrigin) throw new Error("缺少 Chrome 扩展页面来源");
      if (playerFrame) return playerReady;
      stage.innerHTML = "";
      playerFrame = document.createElement("iframe");
      playerFrame.src = `${extensionOrigin}/player/player.html`;
      playerFrame.allow = "autoplay; fullscreen";
      playerFrame.referrerPolicy = "no-referrer";
      playerReady = new Promise((resolve) => {
        playerFrame.addEventListener("load", resolve, { once: true });
      });
      stage.appendChild(playerFrame);
      return playerReady;
    }

    async function checkInstall() {
      const status = await detector.ensureOriginAllowed();
      renderStatus(status);
      return status;
    }

    async function play(url = urlInput.value.trim()) {
      const status = await checkInstall();
      if (!status.installed || !status.nativeOk || !status.originAllowed) {
        log("安装或授权未完成，无法播放。");
        return status;
      }
      if (!/^rtsps?:\/\//i.test(url)) {
        log("请输入 rtsp:// 或 rtsps:// 开头的地址。");
        return status;
      }
      await ensureFrame();
      playerFrame.contentWindow.postMessage({
        type: "RTSP_PLAYER_INIT",
        url,
        autoplay: true,
        controls: true,
        muted: true,
        transport: "tcp",
        rtspTransport: "tcp",
        mediaTransport: "auto",
        codec: "auto",
      }, extensionOrigin);
      log("已发送播放请求，优先 WebRTC，失败自动回退 WebSocket/WebCodecs。");
      return status;
    }

    function stop() {
      if (playerFrame?.contentWindow && extensionOrigin) {
        playerFrame.contentWindow.postMessage({ type: "RTSP_PLAYER_STOP" }, extensionOrigin);
      }
      log("已发送停止请求。");
    }

    window.RTSPDemo = { checkInstall, play, stop, detector };

    window.addEventListener("message", (event) => {
      if (event.origin !== extensionOrigin) return;
      const data = event.data || {};
      if (data.type === "RTSP_PLAYER_READY") log("播放器就绪。");
      if (data.type === "RTSP_PLAYER_ERROR") log(`播放错误：${data.error || "未知错误"}`);
      if (data.type === "RTSP_PLAYER_RECOVERING") log(`正在自动恢复：${data.reason || "恢复中"}`);
      if (data.type === "RTSP_PLAYER_RECOVERED") log("播放已自动恢复。");
    });

    document.querySelector("#checkBtn").addEventListener("click", checkInstall);
    document.querySelector("#playBtn").addEventListener("click", () => play());
    document.querySelector("#stopBtn").addEventListener("click", stop);

    renderDownloads();
    checkInstall();
  </script>
</body>
</html>
